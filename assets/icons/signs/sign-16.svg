<svg viewBox="0 0 200 145" xmlns="http://www.w3.org/2000/svg" width="188" height="136"> <rect width="200" height="145" rx="8" fill="#111f2e"/> <rect x="8" y="8" width="60" height="129" rx="4" fill="#666"/> <rect x="76" y="8" width="60" height="129" rx="4" fill="#666"/> <rect x="144" y="8" width="60" height="129" rx="4" fill="#666"/> <line x1="72" y1="8" x2="72" y2="137" stroke="white" stroke-width="1.5" stroke-dasharray="8,5"/> <line x1="140" y1="8" x2="140" y2="137" stroke="white" stroke-width="1.5" stroke-dasharray="8,5"/> <!-- Main car --> <rect x="28" y="90" width="20" height="36" rx="3" fill="#999" stroke="white" stroke-width="1.5"/> <text x="38" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="white">CAR</text> <!-- Blind spot zone --> <ellipse cx="38" cy="68" rx="28" ry="18" fill="rgba(255,80,80,0.25)" stroke="#FF5555" stroke-width="1.5" stroke-dasharray="4,3"/> <!-- Moto X (blind spot) --> <circle cx="38" cy="60" r="12" fill="#FF4444" stroke="white" stroke-width="1.5"/> <text x="38" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">X</text> <!-- Moto Y (visible in mirror, same lane behind) --> <circle cx="38" cy="30" r="12" fill="#44BB44" stroke="white" stroke-width="1.5"/> <text x="38" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Y</text> <!-- Moto Z (adjacent lane) --> <circle cx="108" cy="50" r="12" fill="#4488FF" stroke="white" stroke-width="1.5"/> <text x="108" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Z</text> <!-- Legend --> <rect x="145" y="30" width="50" height="75" rx="4" fill="rgba(0,0,0,0.55)"/> <circle cx="155" cy="44" r="6" fill="#FF4444"/><text x="164" y="48" font-family="Arial,sans-serif" font-size="8" fill="white">X = blind spot</text> <circle cx="155" cy="62" r="6" fill="#44BB44"/><text x="164" y="66" font-family="Arial,sans-serif" font-size="8" fill="white">Y = visible</text> <circle cx="155" cy="80" r="6" fill="#4488FF"/><text x="164" y="84" font-family="Arial,sans-serif" font-size="8" fill="white">Z = adjacent</text></svg>

