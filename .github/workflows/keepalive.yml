name: Supabase keep-alive

# The production Supabase project runs on the free tier, which PAUSES the
# database after ~7 days without API activity (it happened on 2026-07 —
# login/sync were down until a manual restore on 2026-08-05). This workflow
# issues a real PostgREST query twice a day so the project always registers
# activity. Remove it if the project ever moves to a paid plan.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6,18 * * *"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST (counts as project activity)
        run: |
          # The anon key is the PUBLIC client key (it ships in the web
          # bundle); it grants nothing beyond RLS. Not a secret.
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ29ndGFlaWZ5eHd6ZW5jaWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjIzNjgsImV4cCI6MjA5MzM5ODM2OH0.MD9Sc3xUyhheL1MQLUBqd0lmusvjWsrjuKDranRzvGM"
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "https://olgogtaeifyxwzencilo.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "PostgREST status: ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::Supabase keep-alive probe failed (HTTP ${status})"
            cat /tmp/body
            exit 1
          fi

      - name: Warm the production site
        run: |
          curl -s -o /dev/null -w "site status: %{http_code}\n" \
            --max-time 30 --retry 2 --retry-delay 5 \
            https://kangalearner.com.au
