# Deploys the root static SPA to GitHub Pages using the Vite build (`pnpm run site:build`).
# Output: `dist-vite/` (includes `window.__KANGA_ENV__` from optional repo Variables — see docs).
# After the first successful run, set: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "CNAME"
      - "_headers"
      - "robots.txt"
      - "sitemap.xml"
      - "manifest.json"
      - "sw.js"
      - "e2e/**"
      - "playwright.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "vercel.json"
      - "src/**"
      - ".env.example"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E smoke tests
        run: pnpm run test:e2e
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site (Vite → dist-vite)
        run: pnpm run site:build
        env:
          # Project Pages URL is https://<user>.github.io/<repository>/ — Rollup must emit /repo/... URLs.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Repository Variables (Settings → Secrets and variables → Actions → Variables).
          # Optional: omit or leave empty → __KANGA_ENV__ strings empty → Supabase "not configured" mode.
          # Anon key is public in the browser by design; never use the service role key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Prepare Pages root
        run: touch dist-vite/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-vite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
