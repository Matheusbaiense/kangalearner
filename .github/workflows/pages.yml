# Deploys the static site at repo root (index.html + assets/) to GitHub Pages.
# After the first successful run, set: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "CNAME"
      - "_headers"
      - "robots.txt"
      - "sitemap.xml"
      - "manifest.json"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp CNAME _site/ 2>/dev/null || true
          cp _headers _site/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
