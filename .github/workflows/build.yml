name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` succeeds without repo secrets. Override in GitHub → Settings → Secrets and variables → Actions → Variables if needed.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-build-not-a-real-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Version comes from package.json "packageManager" (pnpm@9.12.0); do not set `version` here or the action errors on mismatch.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check (static root)
        run: pnpm run format:check

      - name: Detect questions data changes
        id: questions_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD~1)"
            head_sha="$(git rev-parse HEAD)"
          fi

          echo "Diff range: $base_sha..$head_sha"
          changed="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          echo "$changed"

          if echo "$changed" | grep -E '^assets/js/data/' >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate questions (when data changes)
        if: steps.questions_changes.outputs.changed == 'true'
        run: pnpm run validate:questions

      # NOTE: Static site E2E and core-questions sync steps removed (2026-05-21).
      # GitHub Pages retired — Vercel is the canonical platform. Next.js E2E to be
      # added separately via Playwright + Vercel preview URLs when ready.

      - name: Build
        run: pnpm run build
