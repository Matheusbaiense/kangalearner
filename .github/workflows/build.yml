name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` succeeds without repo secrets. Override in GitHub → Settings → Secrets and variables → Actions → Variables if needed.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-build-not-a-real-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Version comes from package.json "packageManager" (pnpm@9.12.0); do not set `version` here or the action errors on mismatch.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check (static root)
        run: pnpm run format:check

      - name: Validate questions (core)
        run: |
          COUNT=$(grep -c '"id":' packages/core/src/data/questions.ts)
          echo "Questions in core: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "ERROR: Expected at least 50 questions, got $COUNT"
            exit 1
          fi

      # NOTE: Static site E2E and core-questions sync steps removed (2026-05-21).
      # GitHub Pages retired — Vercel is the canonical platform. Next.js E2E to be
      # added separately via Playwright + Vercel preview URLs when ready.

      - name: Build
        run: pnpm run build
