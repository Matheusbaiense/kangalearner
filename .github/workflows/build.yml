name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` succeeds without repo secrets. Override in GitHub → Settings → Secrets and variables → Actions → Variables if needed.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-build-not-a-real-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from package.json "packageManager" (pnpm@9.12.0); do not set `version` here or the action errors on mismatch.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Format check (static root)
        run: pnpm run format:check

      - name: Validate questions (core)
        run: |
          # Match Prettier-formatted object keys (`id: "..."`), not legacy quoted keys (`"id":`).
          COUNT=$(grep -cE '^\s+id: "' packages/core/src/data/questions.ts)
          echo "Questions in core: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "ERROR: Expected at least 50 questions, got $COUNT"
            exit 1
          fi

      # NOTE: Static site E2E and core-questions sync steps removed (2026-05-21).
      # GitHub Pages retired — Vercel is the canonical platform. Next.js E2E to be
      # added separately via Playwright + Vercel preview URLs when ready.

      - name: Check questions JSON is in sync with core dataset
        run: |
          pnpm --filter web run gen:questions-json
          git diff --exit-code apps/web/public/data/ || \
            (echo "ERROR: apps/web/public/data questions JSON is stale — run 'pnpm --filter web run gen:questions-json' and commit the result" && exit 1)

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm --filter @kanga/web run test:e2e:install

      - name: E2E smoke (Playwright)
        run: pnpm test:e2e
        env:
          CI: "true"
