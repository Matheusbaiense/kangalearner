name: Format check

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g prettier@3
      - run: prettier --check index.html "assets/js/**/*.js" "assets/css/**/*.css"
